version: '3.9'

services:
  postgresdb:
    ports:
      - $LOCAL_DB_PORT:$DB_PORT

  backend:
    build:
      context: ./Servers
      dockerfile: Dockerfile.dev
    # Build locally and never re-pull the upstream image over our tag (it lacks the
    # db.ts SSL changes and would break the Aiven connection).
    pull_policy: build
    # volumes:
    #   - ./Servers/:/app
    env_file:
      - ./.env.dev

  worker:
    # Build from local source (same Dockerfile.dev as backend) so the worker gets
    # our edited db.ts (SSL for Aiven). Without a build section, compose falls back
    # to pull_policy:always and pulls the upstream image (no SSL) — which Aiven
    # rejects with "no pg_hba.conf entry ... no encryption". pull_policy:build
    # prevents that re-pull on a plain `up`.
    build:
      context: ./Servers
      dockerfile: Dockerfile.dev
    pull_policy: build
    # The dev image compiles TS at runtime via `npm run watch`. The base compose
    # runs `node dist/jobs/worker.js` directly, which fails because dist/ isn't
    # precompiled. Build first, then run the worker.
    command: ["sh", "-c", "npm run build && node dist/jobs/worker.js"]
    env_file:
      - ./.env.dev

  frontend:
    # Use the prebuilt production image (nginx) and fix it for the Docker topology:
    #   - map host 5173 -> container 80 (nginx listens on 80)
    #   - mount a corrected nginx conf that proxies /api to the backend container
    #   - serve our locally-built (rebranded) bundle instead of the image's bundle
    ports:
      - "5173:80"
    volumes:
      - ./nginx.frontend.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./Clients/dist:/usr/share/nginx/html:ro

  # bias_and_fairness_backend:
  #   build:
  #     context: ./BiasAndFairnessServers
  #     dockerfile: Dockerfile.dev
  #   volumes:
  #     - ./BiasAndFairnessServers/src:/app

  eval_server:
    build:
      context: ./EvalServer
      dockerfile: Dockerfile.dev
    volumes:
      - ./EvalServer/src:/app
      - eval_uploads-dev:/app/data/uploads
    # The prebuilt image's entrypoint is ./start.sh, which the src mount hides.
    # Run alembic + uvicorn directly from the mounted source instead.
    entrypoint: ["sh", "-c", "alembic upgrade head && uvicorn app:app --host 0.0.0.0 --port 8000"]

  ai_gateway:
    build:
      context: ./AIGateway
      dockerfile: Dockerfile.dev
    # Mount local source so SQL fixes (CAST(...) casts) run without a full rebuild.
    # The container uses the image's installed deps + this edited source (uvicorn --reload).
    volumes:
      - ./AIGateway/src:/app
    # The prebuilt image's entrypoint is ./start.sh, which the src mount hides.
    # Run alembic + uvicorn directly from the mounted source instead.
    # NOTE: no --reload — the reloader wedges on long-lived SSE connections (the
    # FlowTrace live stream), which takes the whole gateway down. Code edits now
    # need a manual `docker compose restart ai_gateway` to take effect.
    entrypoint: ["sh", "-c", "alembic upgrade head && uvicorn app:app --host 0.0.0.0 --port 8100"]
    ports:
      - "8100:8100"
    env_file:
      - ./.env.dev

volumes:
  eval_uploads-dev:
