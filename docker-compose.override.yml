version: '3.9'

services:
  postgresdb:
    ports:
      - $LOCAL_DB_PORT:$DB_PORT

  backend:
    build:
      context: ./Servers
      dockerfile: Dockerfile.dev
    # volumes:
    #   - ./Servers/:/app
    env_file:
      - ./.env.dev

  frontend:
    # Use the prebuilt production image (nginx) and fix it for the Docker topology:
    #   - map host 5173 -> container 80 (nginx listens on 80)
    #   - mount a corrected nginx conf that proxies /api to the backend container
    #   - serve our locally-built (rebranded) bundle instead of the image's bundle
    ports:
      - "5173:80"
    volumes:
      - ./nginx.frontend.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./Clients/dist:/usr/share/nginx/html:ro

  # bias_and_fairness_backend:
  #   build:
  #     context: ./BiasAndFairnessServers
  #     dockerfile: Dockerfile.dev
  #   volumes:
  #     - ./BiasAndFairnessServers/src:/app

  eval_server:
    build:
      context: ./EvalServer
      dockerfile: Dockerfile.dev
    volumes:
      - ./EvalServer/src:/app
      - eval_uploads-dev:/app/data/uploads
    # The prebuilt image's entrypoint is ./start.sh, which the src mount hides.
    # Run alembic + uvicorn directly from the mounted source instead.
    entrypoint: ["sh", "-c", "alembic upgrade head && uvicorn app:app --host 0.0.0.0 --port 8000"]

  ai_gateway:
    build:
      context: ./AIGateway
      dockerfile: Dockerfile.dev
    # Mount local source so SQL fixes (CAST(...) casts) run without a full rebuild.
    # The container uses the image's installed deps + this edited source (uvicorn --reload).
    volumes:
      - ./AIGateway/src:/app
    # The prebuilt image's entrypoint is ./start.sh, which the src mount hides.
    # Run alembic + uvicorn directly from the mounted source instead.
    entrypoint: ["sh", "-c", "alembic upgrade head && uvicorn app:app --host 0.0.0.0 --port 8100 --reload"]
    ports:
      - "8100:8100"
    env_file:
      - ./.env.dev

volumes:
  eval_uploads-dev:
