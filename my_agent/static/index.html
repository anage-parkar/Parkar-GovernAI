  <script>
    const CLIENT_ID = "__GOOGLE_CLIENT_ID__";
    let idToken = sessionStorage.getItem("aioniq_token") || null;
    let userEmail = sessionStorage.getItem("aioniq_email") || null;

    function ui() {
      const signedIn = !!idToken;
      document.getElementById("signin-card").classList.toggle("hidden", signedIn);
      document.getElementById("chat").classList.toggle("hidden", !signedIn);
      document.getElementById("composer").classList.toggle("hidden", !signedIn);
      document.getElementById("who").classList.toggle("hidden", !signedIn);
      if (signedIn) document.getElementById("who-email").textContent = userEmail || "";
    }

    function onCredential(resp) {
      idToken = resp.credential;
      try { userEmail = JSON.parse(atob(idToken.split(".")[1])).email; } catch {}
      sessionStorage.setItem("aioniq_token", idToken);
      sessionStorage.setItem("aioniq_email", userEmail || "");
      ui();

      google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential });

      ui();
    };

      idToken = null; userEmail = null;
      sessionStorage.clear();
      document.getElementById("chat").innerHTML = "";
      ui();
    }

    async function newChat() {
      await fetch("/api/reset", { method: "POST", headers: { Authorization: "Bearer " + idToken } });
      document.getElementById("chat").innerHTML = "";
    }

    function addMsg(role, text, tools) {
      const chat = document.getElementById("chat");
      const row = document.createElement("div");
      row.className = "msg " + role;
      const wrap = document.createElement("div");
      const b = document.createElement("div");
      b.className = "bubble"; b.textContent = text;
      wrap.appendChild(b);
      if (tools && tools.length) {
        const t = document.createElement("div");
        t.className = "tools"; t.textContent = "tools: " + tools.join(", ");
        wrap.appendChild(t);
      }
      row.appendChild(wrap);
      chat.appendChild(row);
      window.scrollTo(0, document.body.scrollHeight);
      return b;
    }

    async function send() {
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text || !idToken) return;
      input.value = "";
      addMsg("user", text);
      const btn = document.getElementById("sendBtn");
      btn.disabled = true;
      const typing = addMsg("bot", "…thinking");
      try {
        const r = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + idToken },
          body: JSON.stringify({ message: text }),
        });
        const data = await r.json();
        if (r.status === 401) {
          typing.textContent = "Session expired — please sign in again.";
          signOut();
          return;
        }
        typing.textContent = data.reply || data.detail || "(error)";
        if (data.tools_used && data.tools_used.length) {
          const t = document.createElement("div");
          t.className = "tools"; t.textContent = "tools: " + data.tools_used.join(", ");
          typing.parentElement.appendChild(t);
        }
      } catch (e) {
        typing.textContent = "Request failed: " + e;
      } finally {
        btn.disabled = false;
      }
    }
  </script>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIONIQ Assistant</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* ── Tokens: GovernAI family (light + dark) ─────────────────────────── */
    :root {
      --ink: #0b1220; --soft: #4a5468; --line: #e3e6ea;
      --bg: #f6f7f9; --surface: #ffffff; --surface-2: #eef1f5;
      --accent: #1b3a6b; --accent-hover: #152e54; --glow: #5b8def;
      --ok: #16a34a; --warn: #d97706;
      --bubble-user: #1b3a6b; --bubble-user-ink: #fff;
      --shadow: 0 10px 30px -18px rgba(11,18,32,.35);
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e8ecf3; --soft: #98a2b6; --line: rgba(255,255,255,.1);
        --bg: #0b1220; --surface: #121b2d; --surface-2: #182338;
        --accent: #5b8def; --accent-hover: #79a3f3; --glow: #5b8def;
        --ok: #4ade80; --warn: #fbbf24;
        --bubble-user: #1f3f74; --bubble-user-ink: #eaf1ff;
        --shadow: 0 10px 30px -18px rgba(0,0,0,.6);
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; font-family: Inter, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--ink);
      background-image: radial-gradient(70% 40% at 50% -10%, color-mix(in srgb, var(--glow) 14%, transparent), transparent 70%);
      background-repeat: no-repeat;
    }
    button { font: inherit; cursor: pointer; }
    .hidden { display: none !important; }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 50;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 10px 20px;
      background: color-mix(in srgb, var(--surface) 85%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
    .brand .mark {
      width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--glow)); color: #fff; font-size: 13px;
    }
    .brand span { color: var(--accent); }
    .gov-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
      color: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px;
    }
    .gov-pill i {
      width: 6px; height: 6px; border-radius: 50%; background: var(--ok);
      animation: blink 1.8s ease-in-out infinite;
    }
    @keyframes blink { 50% { opacity: .35; } }
    .who { font-size: 12.5px; color: var(--soft); display: flex; align-items: center; gap: 8px; }
    .who .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--surface-2); border: 1px solid var(--line);
      display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--accent);
    }
    .who button {
      border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      border-radius: 8px; padding: 6px 12px; font-size: 12.5px;
      transition: border-color .15s, transform .15s;
    }
    .who button:hover { border-color: var(--accent); transform: translateY(-1px); }

    /* ── Sign-in ────────────────────────────────────────────────────────── */
    #signin-card {
      max-width: 400px; margin: 14vh auto 0; background: var(--surface);
      border: 1px solid var(--line); border-radius: 18px; padding: 36px 32px;
      text-align: center; box-shadow: var(--shadow);
      animation: rise .5s ease both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    #signin-card .mark {
      width: 48px; height: 48px; border-radius: 14px; margin: 0 auto 16px;
      display: grid; place-items: center; font-size: 22px; color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--glow));
      box-shadow: 0 8px 24px -8px color-mix(in srgb, var(--glow) 60%, transparent);
    }
    #signin-card h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: -.01em; }
    #signin-card p { font-size: 13px; color: var(--soft); margin: 0 0 24px; line-height: 1.55; }
    #gbtn { display: flex; justify-content: center; }
    .signin-foot {
      margin-top: 20px; font-family: var(--mono); font-size: 10.5px; color: var(--soft);
      display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
    }

    /* ── Chat ───────────────────────────────────────────────────────────── */
    main { max-width: 780px; margin: 0 auto; padding: 28px 16px 150px; }

    #welcome { text-align: center; padding: 9vh 8px 0; animation: rise .5s ease both; }
    #welcome h2 { font-size: 26px; letter-spacing: -.02em; margin: 0 0 8px; }
    #welcome h2 em {
      font-style: normal;
      background: linear-gradient(92deg, var(--accent), var(--glow));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #welcome p { color: var(--soft); font-size: 14px; margin: 0 0 26px; }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .chips button {
      border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      border-radius: 999px; padding: 9px 16px; font-size: 13px;
      transition: all .15s ease;
    }
    .chips button:hover {
      border-color: var(--accent); transform: translateY(-2px);
      box-shadow: 0 8px 20px -12px color-mix(in srgb, var(--glow) 50%, transparent);
    }

    .msg { margin: 18px 0; display: flex; gap: 10px; animation: rise .35s ease both; }
    .msg .pfp {
      width: 30px; height: 30px; border-radius: 10px; flex-shrink: 0; margin-top: 2px;
      display: grid; place-items: center; font-size: 12.5px; font-weight: 600;
    }
    .msg.bot .pfp { background: linear-gradient(135deg, var(--accent), var(--glow)); color: #fff; }
    .msg.user .pfp { background: var(--surface-2); border: 1px solid var(--line); color: var(--accent); }
    .msg.user { flex-direction: row-reverse; }
    .msg .col { max-width: 82%; min-width: 0; }
    .msg.user .col { display: flex; flex-direction: column; align-items: flex-end; }
    .bubble {
      padding: 12px 16px; border-radius: var(--radius); font-size: 14.5px; line-height: 1.6;
      word-break: break-word; overflow-wrap: anywhere;
    }
    .msg.user .bubble {
      background: var(--bubble-user); color: var(--bubble-user-ink);
      border-bottom-right-radius: 5px; white-space: pre-wrap;
    }
    .msg.bot .bubble {
      background: var(--surface); border: 1px solid var(--line);
      border-bottom-left-radius: 5px; box-shadow: var(--shadow);
    }
    .bubble code {
      font-family: var(--mono); font-size: 12.5px;
      background: var(--surface-2); border: 1px solid var(--line);
      border-radius: 5px; padding: 1px 5px;
    }
    .bubble pre {
      background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px;
      padding: 12px; overflow-x: auto; margin: 8px 0;
    }
    .bubble pre code { background: none; border: 0; padding: 0; font-size: 12.5px; }
    .bubble a { color: var(--accent); }

    .receipt {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      margin-top: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--soft);
    }
    .receipt .chip {
      border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .receipt .chip.gov { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
    .receipt .copy {
      border: 1px solid var(--line); background: none; color: var(--soft);
      border-radius: 999px; padding: 2px 8px; font-family: var(--mono); font-size: 10.5px;
      transition: color .15s, border-color .15s;
    }
    .receipt .copy:hover { color: var(--accent); border-color: var(--accent); }

    .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
    .typing i {
      width: 6px; height: 6px; border-radius: 50%; background: var(--soft);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 30% { transform: translateY(-5px); opacity: .5; } }

    /* ── Composer ───────────────────────────────────────────────────────── */
    #composer {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      padding: 14px 16px 16px;
      background: linear-gradient(transparent, var(--bg) 28%);
    }
    #composer .inner {
      max-width: 780px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
      padding: 10px; box-shadow: var(--shadow);
      transition: border-color .2s, box-shadow .2s;
    }
    #composer .inner:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--glow) 18%, transparent), var(--shadow);
    }
    #input {
      flex: 1; resize: none; border: 0; outline: 0; background: none; color: var(--ink);
      font: inherit; font-size: 14.5px; line-height: 1.5; max-height: 160px; padding: 6px 6px;
    }
    #sendBtn {
      background: var(--accent); color: #fff; border: 0; border-radius: 11px;
      width: 40px; height: 40px; flex-shrink: 0; display: grid; place-items: center;
      transition: background .15s, transform .15s;
    }
    #sendBtn:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
    #sendBtn:disabled { opacity: .45; cursor: default; }
    #sendBtn svg { width: 18px; height: 18px; }
    .note {
      max-width: 780px; margin: 8px auto 0; font-family: var(--mono); font-size: 10.5px;
      color: var(--soft); text-align: center; display: flex; justify-content: center; gap: 6px; align-items: center;
    }
    .note i { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); display: inline-block; }

    .toast {
      position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
      box-shadow: var(--shadow); padding: 10px 16px; font-size: 13px; z-index: 60;
      animation: rise .3s ease both;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    @media (max-width: 560px) {
      .gov-pill { display: none; }
      .msg .col { max-width: 88%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="mark">◆</div>AIONIQ <span>Assistant</span></div>
    <div class="gov-pill"><i></i>governed · parkar governai</div>
    <div class="who hidden" id="who">
      <div class="avatar" id="who-avatar">·</div>
      <span id="who-email"></span>
      <button onclick="newChat()">New chat</button>
      <button onclick="signOut()">Sign out</button>
    </div>
  </header>

  <div id="signin-card">
    <div class="mark">◆</div>
    <h1>Sign in to continue</h1>
    <p>Your conversations run through the Parkar GovernAI gateway — governed, logged, and attributed to your account.</p>
    <div id="gbtn"></div>
    <div class="signin-foot"><span>policy-enforced</span><span>·</span><span>pii-guarded</span><span>·</span><span>audit-logged</span></div>
  </div>

  <main id="chat" class="hidden">
    <div id="welcome">
      <h2>How can I help, <em id="hello-name">there</em>?</h2>
      <p>Web search and calculator are available. Every request is governed.</p>
      <div class="chips">
        <button onclick="ask('What can you do?')">What can you do?</button>
        <button onclick="ask('Search the web for today\'s top AI governance news')">Today's AI news</button>
        <button onclick="ask('Calculate 18% GST on ₹42,500')">18% GST on ₹42,500</button>
        <button onclick="ask('Summarize the EU AI Act risk tiers in simple terms')">EU AI Act risk tiers</button>
      </div>
    </div>
  </main>

  <div id="composer" class="hidden">
    <div class="inner">
      <textarea id="input" rows="1" placeholder="Ask anything…"
        oninput="autosize(this)"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
      <button id="sendBtn" onclick="send()" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
      </button>
    </div>
    <div class="note"><i></i>Governed by Parkar GovernAI — prompts, responses, and usage are logged for compliance.</div>
  </div>

  <script>
    const CLIENT_ID = "__GOOGLE_CLIENT_ID__";
    let idToken = sessionStorage.getItem("aioniq_token") || null;
    let userEmail = sessionStorage.getItem("aioniq_email") || null;
    let history = []; // [{role, text, tools}]
    try { history = JSON.parse(sessionStorage.getItem("aioniq_history") || "[]"); } catch {}

    // ── UI state ─────────────────────────────────────────────────────────
    function ui() {
      const signedIn = !!idToken;
      document.getElementById("signin-card").classList.toggle("hidden", signedIn);
      document.getElementById("chat").classList.toggle("hidden", !signedIn);
      document.getElementById("composer").classList.toggle("hidden", !signedIn);
      document.getElementById("who").classList.toggle("hidden", !signedIn);
      if (signedIn) {
        document.getElementById("who-email").textContent = userEmail || "";
        const initial = (userEmail || "?")[0].toUpperCase();
        document.getElementById("who-avatar").textContent = initial;
        document.getElementById("hello-name").textContent = (userEmail || "there").split("@")[0];
        document.getElementById("welcome").classList.toggle("hidden", history.length > 0);
      }
    }

    function onCredential(resp) {
      idToken = resp.credential;
      try { userEmail = JSON.parse(atob(idToken.split(".")[1])).email; } catch {}
      sessionStorage.setItem("aioniq_token", idToken);
      sessionStorage.setItem("aioniq_email", userEmail || "");
      ui();
    }

    window.onload = () => {
      google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential });
      google.accounts.id.renderButton(document.getElementById("gbtn"),
        { theme: "outline", size: "large", text: "signin_with", width: 280 });
      ui();
      history.forEach(m => addMsg(m.role, m.text, m.tools, false));
      if (history.length) window.scrollTo(0, document.body.scrollHeight);
    };

    function signOut() {
      idToken = null; userEmail = null; history = [];
      sessionStorage.clear();
      clearChat();
      ui();
    }

    async function newChat() {
      try { await fetch("/api/reset", { method: "POST", headers: { Authorization: "Bearer " + idToken } }); } catch {}
      history = [];
      sessionStorage.removeItem("aioniq_history");
      clearChat();
      ui();
    }

    function clearChat() {
      document.querySelectorAll("#chat .msg").forEach(n => n.remove());
    }

    function saveHistory() {
      try { sessionStorage.setItem("aioniq_history", JSON.stringify(history.slice(-40))); } catch {}
    }

    function toast(text) {
      const t = document.createElement("div");
      t.className = "toast"; t.textContent = text;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2600);
    }

    // ── Markdown-lite (escape first, then enrich) ────────────────────────
    function esc(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function fmt(s) {
      let h = esc(s);
      h = h.replace(/```([\s\S]*?)```/g, (_, c) => "<pre><code>" + c.replace(/^\n|\n$/g, "") + "</code></pre>");
      h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
      h = h.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
      h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
      h = h.replace(/^[-•] (.+)$/gm, "• $1");
      return h.replace(/\n/g, "<br>");
    }

    // ── Messages ─────────────────────────────────────────────────────────
    function addMsg(role, text, tools, scroll = true) {
      document.getElementById("welcome").classList.add("hidden");
      const chat = document.getElementById("chat");
      const row = document.createElement("div");
      row.className = "msg " + role;

      const pfp = document.createElement("div");
      pfp.className = "pfp";
      pfp.textContent = role === "bot" ? "◆" : (userEmail || "?")[0].toUpperCase();

      const col = document.createElement("div");
      col.className = "col";
      const b = document.createElement("div");
      b.className = "bubble";
      if (role === "bot") b.innerHTML = fmt(text); else b.textContent = text;
      col.appendChild(b);
      if (role === "bot") col.appendChild(makeReceipt(text, tools));

      row.appendChild(pfp);
      row.appendChild(col);
      chat.appendChild(row);
      if (scroll) window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      return { bubble: b, col, row };
    }

    function makeReceipt(text, tools) {
      const r = document.createElement("div");
      r.className = "receipt";
      const gov = document.createElement("span");
      gov.className = "chip gov"; gov.textContent = "✓ governed";
      r.appendChild(gov);
      (tools || []).forEach(t => {
        const c = document.createElement("span");
        c.className = "chip"; c.textContent = t;
        r.appendChild(c);
      });
      const copy = document.createElement("button");
      copy.className = "copy"; copy.textContent = "copy";
      copy.onclick = () => {
        navigator.clipboard.writeText(text).then(() => {
          copy.textContent = "copied";
          setTimeout(() => (copy.textContent = "copy"), 1500);
        });
      };
      r.appendChild(copy);
      return r;
    }

    function typingIndicator() {
      const { bubble, col, row } = addMsg("bot", "");
      bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
      col.querySelector(".receipt")?.remove();
      return { bubble, col, row };
    }

    // ── Composer ─────────────────────────────────────────────────────────
    function autosize(el) {
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight, 160) + "px";
    }
    function ask(q) {
      const input = document.getElementById("input");
      input.value = q;
      send();
    }

    async function send() {
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text || !idToken) return;
      input.value = ""; autosize(input);

      addMsg("user", text);
      history.push({ role: "user", text });
      saveHistory();

      const btn = document.getElementById("sendBtn");
      btn.disabled = true;
      const t = typingIndicator();

      try {
        const r = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + idToken },
          body: JSON.stringify({ message: text }),
        });
        const data = await r.json();

        if (r.status === 401) {
          t.row.remove();
          toast("Session expired — please sign in again.");
          signOut();
          return;
        }

        const reply = data.reply || data.detail || "(error)";
        const tools = data.tools_used || [];
        t.bubble.innerHTML = fmt(reply);
        t.col.appendChild(makeReceipt(reply, tools));
        history.push({ role: "bot", text: reply, tools });
        saveHistory();
      } catch (e) {
        t.bubble.textContent = "Request failed: " + e;
      } finally {
        btn.disabled = false;
        input.focus();
        window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
